name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    # 原子化幂等设计：每个时间槽执行完全相同的操作——
    # guard 检查今天是否已读 → 已读则直接退出，未读则执行阅读，失败则告警。
    # 多设几个时间槽互为兑底，任一槽被 GitHub 调度延迟/丢弃，下一槽自动补上。
    # 分钟数避开整点，降低被调度高峰延迟/丢弃的概率。
    # 道一·主任务：北京时间每天 00:23（UTC 前一天 16:23）
    - cron: '23 16 * * *'
    # 道二·上午兑底：北京时间每天 08:41（UTC 00:41）
    - cron: '41 0 * * *'
    # 道三·晚间终检：北京时间每天 17:37（UTC 09:37）
    - cron: '37 9 * * *'
    # 其他可选时段（保持同样原子逻辑，需要时取消注释）：
    # - cron: '0 21 * * *'   # BJT 05:00
    # - cron: '40 3 * * *'   # BJT 11:40
    # - cron: '0 14 * * *'   # BJT 22:00
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境
    permissions:
      actions: read  # 用于查询本工作流今日是否已有成功运行（防重复）

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Guard - skip if today's read already succeeded
      id: guard
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python guard.py

    - name: Run deployment script
      if: steps.guard.outputs.skip != 'true'
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        python main.py

    - name: Alert on failure
      if: failure()
      env:
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
      run: python alert.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
