name: wxread-check

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  schedule:
    # 道二·上午自愈：北京时间每天 08:41（UTC 00:41），未成功则自动补跑
    - cron: "41 0 * * *"
    # 道三·晚间终检：北京时间每天 17:37（UTC 09:37），最终兜底，仍失败才推送告警
    - cron: "37 9 * * *"
  workflow_dispatch: # 手动触发

jobs:
  check:
    runs-on: ubuntu-22.04
    environment: AutoRead # 指定环境
    permissions:
      actions: write # 查询运行记录 + 触发 workflow_dispatch 补跑

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run check script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}

        run: |
          python check.py
